version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: desafio_postgres
    environment:
      POSTGRES_DB: desafio_db
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: senha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d desafio_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: desafio_api
    environment:
      DATABASE_URL: postgresql+psycopg2://usuario:senha@postgres:5432/desafio_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data: